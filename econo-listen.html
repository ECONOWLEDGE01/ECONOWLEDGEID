<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoNowledge — Econo Listen</title>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/ui.css" />
</head>
<body class="eco-page page-listen">

  <header class="eco-header">
    <a class="eco-back" href="./dashboard.html">←</a>
    <img src="./images/logo.png" alt="logo" class="eco-logo"/>
    <h1>Econo Listen</h1>
  </header>

  <main class="eco-content">
    <div class="eco-search">
      <input type="search" placeholder="Cari podcast atau audio..." />
    </div>

    <section class="eco-card-list">
      <article class="eco-card listen-card">
        <img src="./images/pod1.jpg" alt="podcast 1">
        <div class="eco-card-body">
          <h3>Investasi untuk Pemula</h3>
          <p>Episode 01 — Panduan dasar investasi & manajemen risiko.</p>
          <audio class="eco-audio" controls preload="metadata">
            <source src="./media/sample-audio.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung audio.
          </audio>
        </div>
      </article>

      <article class="eco-card listen-card">
        <img src="./images/pod2.jpg" alt="podcast 2">
        <div class="eco-card-body">
          <h3>UMKM & Transformasi Digital</h3>
          <p>Diskusi praktik digitalisasi warung dan pasar tradisional.</p>
          <audio class="eco-audio" controls preload="metadata">
            <source src="./media/sample2-audio.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung audio.
          </audio>
        </div>
      </article>
    </section>
  </main>

  <nav class="eco-bottom-nav">
    <a href="./dashboard.html">🏠</a>
    <a href="./econo-forum.html">💬</a>
    <a href="./econo-read.html">📚</a>
    <a href="./econo-listen.html">🎧</a>
    <a href="./econo-vision.html">🎥</a>
  </nav>

</body>
</html>
